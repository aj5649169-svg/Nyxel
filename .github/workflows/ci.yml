name: Qt 5 QML Lint CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qmllint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 5 QML lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qtdeclarative5-dev-tools

      - name: Verify required theme files exist and are non-empty
        run: |
          for file in theme.qml theme.cfg; do
            if [ ! -s "$file" ]; then
              echo "::error::Required file '$file' is missing or empty"
              exit 1
            fi
          done

      - name: Run Qt 5 qmllint
        run: qmllint theme.qml
